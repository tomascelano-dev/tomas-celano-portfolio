<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Subtitle plan generator pipeline</title>
<desc>A raw video is transcribed with faster-whisper and measured (speaker's face with OpenCV, text widths with the real fonts). A layout engine combines that with the client's format, stored as JSON, and per-video editorial overrides, and writes a timed plan to Excel, overlay guides and preview frames.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
.title{font-size:14px;font-weight:600;}
.sub{font-size:12px;font-weight:400;}
.ext{fill:#f1f5f9;stroke:#cbd5e1;}
.lp{fill:#e6f2ef;stroke:#0f766e;}
.ext-title{fill:#1f2937;}
.ext-sub{fill:#64748b;}
.lp-title{fill:#0f5d56;}
.lp-sub{fill:#0f766e;}
.lbl{fill:#64748b;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="ext" x="40" y="40" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="64" text-anchor="middle">Raw video</text>
<text class="sub ext-sub" x="125" y="82" text-anchor="middle">.mp4 · up to 4K</text>
<rect class="lp" x="255" y="40" width="170" height="54" rx="8"/>
<text class="title lp-title" x="340" y="64" text-anchor="middle">Transcribe</text>
<text class="sub lp-sub" x="340" y="82" text-anchor="middle">faster-whisper large-v3</text>
<rect class="lp" x="470" y="40" width="170" height="54" rx="8"/>
<text class="title lp-title" x="555" y="64" text-anchor="middle">Measure</text>
<text class="sub lp-sub" x="555" y="82" text-anchor="middle">face · real font widths</text>
<line x1="212" y1="67" x2="253" y2="67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="427" y1="67" x2="468" y2="67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="ext" x="40" y="150" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="174" text-anchor="middle">Client format</text>
<text class="sub ext-sub" x="125" y="192" text-anchor="middle">JSON · measured values</text>
<rect class="lp" x="255" y="150" width="170" height="54" rx="8"/>
<text class="title lp-title" x="340" y="174" text-anchor="middle">Layout engine</text>
<text class="sub lp-sub" x="340" y="192" text-anchor="middle">breaks · highlights</text>
<rect class="ext" x="470" y="150" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="174" text-anchor="middle">Per-video overrides</text>
<text class="sub ext-sub" x="555" y="192" text-anchor="middle">editorial layer</text>
<line x1="555" y1="94" x2="405" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="212" y1="177" x2="253" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="468" y1="177" x2="427" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="ext" x="40" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="274" text-anchor="middle">Timed plan</text>
<text class="sub ext-sub" x="125" y="292" text-anchor="middle">Excel · per caption</text>
<rect class="ext" x="255" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="340" y="274" text-anchor="middle">Overlay guides</text>
<text class="sub ext-sub" x="340" y="292" text-anchor="middle">PNG per preset</text>
<rect class="ext" x="470" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="274" text-anchor="middle">Preview frames</text>
<text class="sub ext-sub" x="555" y="292" text-anchor="middle">captions on the shot</text>
<line x1="320" y1="204" x2="140" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="204" x2="340" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="204" x2="540" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
