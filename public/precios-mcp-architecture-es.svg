<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arquitectura de precios-mcp</title>
<desc>Claude estructura las listas de los proveedores y las carga con una tool MCP; n8n usa el mismo servicio por REST. Un servicio FastAPI valida tokens y roles, guarda una lista por proveedor y día en PostgreSQL, y un núcleo de precios determinístico y con tests arma las listas de WhatsApp y las alertas para el dueño.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
.title{font-size:14px;font-weight:600;}
.sub{font-size:12px;font-weight:400;}
.ext{fill:#f1f5f9;stroke:#cbd5e1;}
.lp{fill:#e6f2ef;stroke:#0f766e;}
.ext-title{fill:#1f2937;}
.ext-sub{fill:#64748b;}
.lp-title{fill:#0f5d56;}
.lp-sub{fill:#0f766e;}
.lbl{fill:#64748b;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="ext" x="40" y="40" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="64" text-anchor="middle">Listas de proveedores</text>
<text class="sub ext-sub" x="125" y="82" text-anchor="middle">WhatsApp · PDF · foto</text>
<rect class="ext" x="255" y="40" width="170" height="54" rx="8"/>
<text class="title ext-title" x="340" y="64" text-anchor="middle">Claude</text>
<text class="sub ext-sub" x="340" y="82" text-anchor="middle">lee y estructura</text>
<rect class="ext" x="470" y="40" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="64" text-anchor="middle">n8n</text>
<text class="sub ext-sub" x="555" y="82" text-anchor="middle">cron · Telegram</text>
<line x1="212" y1="67" x2="253" y2="67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="94" x2="340" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="sub lbl" x="350" y="126" text-anchor="start">tool MCP</text>
<line x1="555" y1="94" x2="412" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="sub lbl" x="492" y="126" text-anchor="start">REST</text>
<rect class="ext" x="40" y="150" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="174" text-anchor="middle">Auth</text>
<text class="sub ext-sub" x="125" y="192" text-anchor="middle">tokens hasheados · roles</text>
<rect class="lp" x="255" y="150" width="170" height="54" rx="8"/>
<text class="title lp-title" x="340" y="174" text-anchor="middle">API de precios</text>
<text class="sub lp-sub" x="340" y="192" text-anchor="middle">FastAPI · REST + MCP</text>
<rect class="lp" x="470" y="150" width="170" height="54" rx="8"/>
<text class="title lp-title" x="555" y="174" text-anchor="middle">Núcleo de precios</text>
<text class="sub lp-sub" x="555" y="192" text-anchor="middle">determinístico · con tests</text>
<line x1="253" y1="177" x2="212" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="177" x2="468" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="ext" x="40" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="274" text-anchor="middle">PostgreSQL</text>
<text class="sub ext-sub" x="125" y="292" text-anchor="middle">1 lista / proveedor / día</text>
<rect class="ext" x="255" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="340" y="274" text-anchor="middle">Alertas al dueño</text>
<text class="sub ext-sub" x="340" y="292" text-anchor="middle">typos · vencidas · márgenes</text>
<rect class="ext" x="470" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="274" text-anchor="middle">Listas de WhatsApp</text>
<text class="sub ext-sub" x="555" y="292" text-anchor="middle">con markup aplicado</text>
<line x1="320" y1="204" x2="140" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="204" x2="360" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
