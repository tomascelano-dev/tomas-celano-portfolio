<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Pipeline del generador de pautas</title>
<desc>El video crudo se transcribe con faster-whisper y se mide (la cara con OpenCV, el ancho del texto con las fuentes reales). Un motor de diagramación combina eso con el formato del cliente, guardado como JSON, y los retoques editoriales de cada video, y escribe la pauta timecodeada en Excel, guías superpuestas y cuadros de previa.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
.title{font-size:14px;font-weight:600;}
.sub{font-size:12px;font-weight:400;}
.ext{fill:#f1f5f9;stroke:#cbd5e1;}
.lp{fill:#e6f2ef;stroke:#0f766e;}
.ext-title{fill:#1f2937;}
.ext-sub{fill:#64748b;}
.lp-title{fill:#0f5d56;}
.lp-sub{fill:#0f766e;}
.lbl{fill:#64748b;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="ext" x="40" y="40" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="64" text-anchor="middle">Video crudo</text>
<text class="sub ext-sub" x="125" y="82" text-anchor="middle">.mp4 · hasta 4K</text>
<rect class="lp" x="255" y="40" width="170" height="54" rx="8"/>
<text class="title lp-title" x="340" y="64" text-anchor="middle">Transcripción</text>
<text class="sub lp-sub" x="340" y="82" text-anchor="middle">faster-whisper large-v3</text>
<rect class="lp" x="470" y="40" width="170" height="54" rx="8"/>
<text class="title lp-title" x="555" y="64" text-anchor="middle">Medición</text>
<text class="sub lp-sub" x="555" y="82" text-anchor="middle">cara · ancho real del texto</text>
<line x1="212" y1="67" x2="253" y2="67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="427" y1="67" x2="468" y2="67" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="ext" x="40" y="150" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="174" text-anchor="middle">Formato del cliente</text>
<text class="sub ext-sub" x="125" y="192" text-anchor="middle">JSON · valores medidos</text>
<rect class="lp" x="255" y="150" width="170" height="54" rx="8"/>
<text class="title lp-title" x="340" y="174" text-anchor="middle">Motor de diagramación</text>
<text class="sub lp-sub" x="340" y="192" text-anchor="middle">cortes · resaltes</text>
<rect class="ext" x="470" y="150" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="174" text-anchor="middle">Retoques por video</text>
<text class="sub ext-sub" x="555" y="192" text-anchor="middle">capa editorial</text>
<line x1="555" y1="94" x2="405" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="212" y1="177" x2="253" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="468" y1="177" x2="427" y2="177" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="ext" x="40" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="125" y="274" text-anchor="middle">Pauta timecodeada</text>
<text class="sub ext-sub" x="125" y="292" text-anchor="middle">Excel · por tarjeta</text>
<rect class="ext" x="255" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="340" y="274" text-anchor="middle">Guías superpuestas</text>
<text class="sub ext-sub" x="340" y="292" text-anchor="middle">PNG por preset</text>
<rect class="ext" x="470" y="250" width="170" height="54" rx="8"/>
<text class="title ext-title" x="555" y="274" text-anchor="middle">Cuadros de previa</text>
<text class="sub ext-sub" x="555" y="292" text-anchor="middle">texto sobre el plano</text>
<line x1="320" y1="204" x2="140" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="204" x2="340" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="204" x2="540" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
